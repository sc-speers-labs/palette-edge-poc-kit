# In-cluster ISO file server for the Edge build pipeline.
# The build pod writes ISOs to the RWX Longhorn PVC; nginx serves them; the LXD host
# pulls over HTTP at http://edge-iso.cabin/<name>.iso (requires DNS -> ingress VIP).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: edge-iso
  namespace: edgeforge-build
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: edge-iso-nginx
  namespace: edgeforge-build
data:
  default.conf: |
    server {
      listen 80;
      server_name _;
      root /usr/share/nginx/html;
      autoindex on;
      location / { try_files $uri $uri/ =404; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-iso
  namespace: edgeforge-build
  labels: { app: edge-iso }
spec:
  replicas: 1
  selector: { matchLabels: { app: edge-iso } }
  template:
    metadata:
      labels: { app: edge-iso }
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80 }]
          volumeMounts:
            - { name: iso,  mountPath: /usr/share/nginx/html, readOnly: true }
            - { name: conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf }
      volumes:
        - name: iso
          persistentVolumeClaim: { claimName: edge-iso }
        - name: conf
          configMap: { name: edge-iso-nginx }
---
apiVersion: v1
kind: Service
metadata:
  name: edge-iso
  namespace: edgeforge-build
spec:
  selector: { app: edge-iso }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: edge-iso
  namespace: edgeforge-build
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
spec:
  ingressClassName: nginx
  rules:
    - host: edge-iso.cabin
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: edge-iso
                port: { number: 80 }
