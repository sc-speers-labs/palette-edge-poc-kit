#cloud-config
# MaaS user-data to turn a freshly-deployed Ubuntu node into the persistent LXD host.
# Referenced by ci/maas-ensure-lxd-host.sh on (re)deploy.
package_update: true
snap:
  commands:
    - [install, lxd, --channel=5.21/stable]
write_files:
  - path: /root/lxd-preseed.yaml
    permissions: "0600"
    content: |
      config:
        core.https_address: "[::]:8443"
      networks:
        - name: lxdbr0
          type: bridge
          config: { ipv4.address: auto, ipv6.address: none }
      storage_pools:
        - name: default
          driver: dir            # dir keeps it simple; switch to zfs/btrfs for snapshots
      profiles:
        - name: default
          devices:
            root: { path: /, pool: default, type: disk }
            eth0: { name: eth0, network: lxdbr0, type: nic }
  # Jenkins' LXD client certificate (PUBLIC half — the private key stays in Jenkins).
  # Baked in so a freshly-provisioned host trusts the pipeline automatically.
  - path: /root/jenkins-client.crt
    permissions: "0644"
    content: |
      -----BEGIN CERTIFICATE-----
      MIIByjCCAVCgAwIBAgIUEz8fSr/0CHnESzzs0ASkNm3bW4EwCgYIKoZIzj0EAwIw
      HDEaMBgGA1UEAwwRamVua2lucy1lZGdlZm9yZ2UwHhcNMjYwNjA4MjAzMzM5WhcN
      MzYwNjA1MjAzMzM5WjAcMRowGAYDVQQDDBFqZW5raW5zLWVkZ2Vmb3JnZTB2MBAG
      ByqGSM49AgEGBSuBBAAiA2IABHkefAQs8jU/fzi7Vp4vXDWWfIkKPIgKLJi8Fzq4
      S3t/I+Afta7NPHIb0euTgUKG5Sip5YenzoZeEULS2TrzzrQUA1EcNiFgAiqZiEz4
      qtBCBACiu7L7GAhn0ZSmW1PNwaNTMFEwHQYDVR0OBBYEFCmllbI8frbC3iAYOZg1
      qbnayVE3MB8GA1UdIwQYMBaAFCmllbI8frbC3iAYOZg1qbnayVE3MA8GA1UdEwEB
      /wQFMAMBAf8wCgYIKoZIzj0EAwIDaAAwZQIxAPeR0traCysjuUzRI0FdO2YTwYMO
      U+lUU31OmNK2vcXjYg02/pTCqbxYVLR5Ynf64wIwYe1dNAhoWQMB5YCXyI3ZbNv1
      CFdYPAvwPfk56D3duyLNcQXXo58C+DYkqJXzq5o8
      -----END CERTIFICATE-----
runcmd:
  - [bash, -lc, "lxd waitready && cat /root/lxd-preseed.yaml | lxd init --preseed"]
  # Trust the Jenkins client cert (newer LXD: add-certificate; older: add).
  - [bash, -lc, "lxc config trust add-certificate /root/jenkins-client.crt 2>/dev/null || lxc config trust add /root/jenkins-client.crt"]
