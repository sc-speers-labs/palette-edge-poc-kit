# Privileged Earthly/buildkit agent for the Build stage.
# Deploys into the dedicated privileged-PSA namespace (see BUILD-PIPELINE.md).
# Earthly brings its own buildkit, so the containerd-not-Docker node runtime is fine,
# but it needs privileged for the nested build daemon.
apiVersion: v1
kind: Pod
metadata:
  namespace: edgeforge-build          # must be labeled pod-security.kubernetes.io/enforce=privileged
spec:
  # Resolve the in-cluster ingress hostnames the build needs (push target + ISO publish)
  # regardless of whether cluster DNS forwards the *.cabin zone.
  hostAliases:
    - ip: "192.168.5.13"
      hostnames: ["registry.cabin", "edge-iso.cabin"]
  # No hostname pin — let the scheduler place this on any worker with capacity, so
  # freeing a specific node back to MaaS (to become the LXD host) never strands the
  # build. The resource requests below steer it onto a big-disk node.
  #
  # CanvOS provider targets use `SAVE IMAGE --push`, so build-canvos.sh runs
  # `earthly --push` (pure buildkit — no Docker daemon) and configures buildkit to push
  # to registry.cabin over insecure HTTP. The earthly container is privileged so its
  # embedded buildkitd can run. If buildkit startup proves flaky as a Jenkins agent,
  # switch to an earthly/buildkitd sidecar + EARTHLY_BUILDKIT_HOST (first-run tuning).
  containers:
    - name: earthly
      image: earthly/earthly:v0.8.15   # TODO: pin a version with docker CLI for `docker push`
      command: ["cat"]
      tty: true
      securityContext:
        privileged: true
      resources:
        requests: { cpu: "4", memory: "6Gi", ephemeral-storage: "30Gi" }
        limits:   { cpu: "8", memory: "12Gi", ephemeral-storage: "60Gi" }
      volumeMounts:
        - { name: scratch,  mountPath: /workspace-scratch }
        - { name: edge-iso, mountPath: /edge-iso }   # publish target for the built ISO
  volumes:
    # Longhorn PVC (or emptyDir) for build scratch; emptyDir uses node ephemeral storage.
    - name: scratch
      emptyDir: { sizeLimit: 50Gi }
    # Shared RWX volume the nginx file server serves from (ci/iso-fileserver.yaml).
    - name: edge-iso
      persistentVolumeClaim: { claimName: edge-iso }
