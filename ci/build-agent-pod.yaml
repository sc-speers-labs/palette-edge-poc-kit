# Single agent pod for the whole pipeline — two containers sharing the workspace:
#   tools   : alpine + (bash/jq/curl/gettext/git via the Setup stage) — runs the
#             orchestration stages (preflight, render, verify, and the deploy stages).
#   earthly : privileged earthly/earthly — runs the CanvOS build (pure buildkit,
#             `earthly --push`; no Docker daemon needed).
# The Kubernetes plugin mounts the shared workspace into every container, so build/arg
# written by Render (tools) is visible to the Build stage (earthly) — no stash needed.
# Deploys into the privileged edgeforge-build namespace (PSA privileged + the edge-iso PVC).
apiVersion: v1
kind: Pod
metadata:
  namespace: edgeforge-build
spec:
  # Resolve the in-cluster ingress hostnames (push target + ISO publish) regardless of
  # whether cluster DNS forwards the *.cabin zone.
  hostAliases:
    - ip: "192.168.5.13"
      hostnames: ["registry.cabin", "edge-iso.cabin"]
  containers:
    - name: tools
      image: alpine:3.20
      command: ["cat"]
      tty: true
      resources:
        requests: { cpu: "200m", memory: "256Mi" }
        limits:   { cpu: "1", memory: "1Gi" }
    - name: earthly
      image: earthly/earthly:v0.8.15
      command: ["cat"]
      tty: true
      securityContext:
        privileged: true            # embedded buildkitd needs it
      resources:
        requests: { cpu: "4", memory: "6Gi", ephemeral-storage: "30Gi" }
        limits:   { cpu: "8", memory: "12Gi", ephemeral-storage: "60Gi" }
      volumeMounts:
        - { name: edge-iso, mountPath: /edge-iso }   # ISO publish target (RWX, served by nginx)
  volumes:
    - name: edge-iso
      persistentVolumeClaim: { claimName: edge-iso }
